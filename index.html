<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgebound</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f121a;--bg2:#1a1f2e;--panel:#171c29;--line:#2c3448;--tx:#eceff6;--mut:#8f9ab2;--acc:#ffb347;--acc2:#ff6b3d;--bad:#ff5a6a;--good:#63d99a;--ink:#1a1206;--px:#05060a;box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1eee8;--bg2:#e6e1d8;--panel:#fffdf9;--line:#d3cbbd;--tx:#211d17;--mut:#6d655a;--acc:#c7710a;--acc2:#b3400f;--bad:#c22f40;--good:#1f8a55;--ink:#fff;--px:#241a0e}}
:root[data-theme="dark"]{--bg:#0f121a;--bg2:#1a1f2e;--panel:#171c29;--line:#2c3448;--tx:#eceff6;--mut:#8f9ab2;--acc:#ffb347;--acc2:#ff6b3d;--bad:#ff5a6a;--good:#63d99a;--ink:#1a1206;--px:#05060a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100%;background:radial-gradient(1000px 500px at 50% -10%,var(--bg2),var(--bg));background-color:var(--bg);color:var(--tx);font:17px/1.4 'Barlow Semi Condensed',system-ui,sans-serif}main{max-width:980px;margin:0 auto;padding:14px 16px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:2rem;margin:0;letter-spacing:.02em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:1.2rem;margin:0 0 6px}p{margin:0 0 8px;color:var(--mut)}
</style></head><body><div id="shell"><div id="tbar"></div><main id="app"></main><nav id="nav"></nav></div><div id="modal"></div><div id="ver"></div>
<script>
const EC={fire:'#ff7a3d',ice:'#7fd6ff',shock:'#ffe14d',blood:'#e0345a',void:'#a66bff',toxic:'#7be04f',holy:'#ffffff',none:'#8a8f99'};
const TC=['#63d99a','#4fd6d6','#5aa9e6','#b07cf0','#ffb347','#ff3b3b','#ffffff','#7fe8ff'];
const {P,SB,TW,PRICE,BOSS_COIN,RN,BOSSES,WORLD2,PRICE2,MG_UNLOCK,VERSION,SLOTS,W1BASE,W2BASE,FX,GEM_PACKS,PATCH_NOTES}=Game;
const SL={h:'Handle',b:'Blade',g:'Guard',c:'Core'};
const B=BOSSES;
let GIFT=null,S,USER=null,STATE='',MODE='in',TOKEN=localStorage.getItem('fb:token')||'';
const API_BASE = window.FORGEBOUND_API_URL || (location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://localhost:3000' : 'https://forgeboundgame-production.up.railway.app');
const esc=t=>String(t).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(API_BASE + p,{method:b===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:b===undefined?undefined:JSON.stringify(b)});const t=await r.text();let j;try{j=t?JSON.parse(t):{}}catch(e){throw new Error(t||'Bad server response.')}if(!r.ok)throw new Error(j.error||'Request failed.');return j;}
</script></body></html>
