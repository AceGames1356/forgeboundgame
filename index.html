else if(Math.hypot(x-76,y-10)<10+n*3)col=hs(x,y)==0?'#6a4fa3':'#3b2a6b';
else if(x>=74&&y>=18)col=mt?'#3a3a48':(hs(x,y)<2?'#b3401a':'#ff6b1a');

else col=mt?'#7a7a85':(n>.55?'#3a7a3a':'#5aa84a')}
g.fillStyle=col;g.fillRect(x,y,1,1)}

function render(){if(S.scr!='mini')mgStop();if(S.scr!='cut'){CUTT.forEach(clearTimeout);CUTT=[]}const a=document.getElementById('app'),s=st();let h=head();
if(S.scr=='home'){h+=homeH()}else if(S.scr=='map'){h+=mapH()}else if(S.scr=='cut'){h+=cutH()}else if(S.scr=='minis'){h+=minisH()}else if(S.scr=='mini'){h+=miniH()}else if(S.scr=='minires'){h+=minresH()}else if(S.scr=='end2'){h+=end2H()}else if(S.scr=='admin'){h+=adminH()}else if(S.scr=='settings'){h+=settingsH()}else if(S.scr=='shop'){h+=shopH()}else if(S.scr=='forge'){
h+=`<div class="grid"><div><div class="stage" style="--glow:${EC[s.e]}">${svg()}</div><div class="stats"><div class="stat"><span>Attack</span>${s.atk}</div><div class="stat"><span>Speed</span>${s.spd.toFixed(1)}</div><div class="stat"><span>Defense</span>${s.def}</div><div class="stat"><span>Crit</span>${Math.round(s.crit*100)}%</div><div class="stat"><span>Element</span>${s.e}</div><div class="stat"><span>Clears</span>${S.clears}</div></div></div><div>
<div class="tabs">${Object.keys(SL).map(k=>`<button class="${S.tab==k?'on':''}" onclick="tab('${k}')">${SL[k]}</button>`).join('')}</div>
<div class="parts">${P.filter(p=>p.s==S.tab&&S.owned.includes(p.id)).map(p=>`<button class="part ${S.eq[S.tab]==p.id?'on':''}" style="--tc:${TC[p.t]}" onclick="eq(${p.id})">${ico(p)}<span>${p.n}<small>${desc(p)}</small></span></button>`).join('')}</div>
${forgeBoxH()}</div></div>`}
else if(S.scr=='fight'){h+=fightH()}
else if(S.scr=='lobby'){h+=lobbyH()}else if(S.scr=='wait'){h+=waitH()}else if(S.scr=='tower'){h+=towerH()}else if(S.scr=='trew'){h+=trewH()}else if(S.scr=='tover'){h+=toverH()}else if(S.scr=='over'){h+=`<div class="box" style="max-width:520px;margin:0 auto"><h2>Recoil beat you.</h2><p>You earned ${S.gain} coins${S.gdia?` and ${S.gdia} diamonds`:''} for the damage you dealt. Spend them in the shop on better parts or Vitality, then fight again.</p><button style="width:100%;margin-bottom:8px;text-align:center" onclick="S.scr='shop';render()">Open shop</button><button class="go" onclick="S.scr='forge';render()">Back to forge</button></div>`}
else{h+=rewardH()}
a.innerHTML=h;if(S.scr=='mini')mgInit();if(S.scr=='cut')startCut();if(S.scr=='map')centerMap()}

/* co-op tower (server-driven) */
let T=null,R=null,ES=null;
const NOLOGIN='Log in or create an account first. Co-op uses your account so the server knows your weapon.';
const me=()=>R&&R.players.find(p=>p.u===USER.u)||{hp:100,dead:0,dealt:0,nm:'',eq:S.eq};
const view=()=>{const m=me();return[m,...R.players.filter(p=>p.u!==USER.u)]};
function sub(x){S.sub=x;render()}function pick(n){S.pick=n;render()}
function lobbyH(){const sb=S.sub||'menu',bk=`<button style="margin-top:8px;width:100%;text-align:center" onclick="${sb=='menu'?"S.scr='forge'":"S.sub='menu'"};render()">${sb=='menu'?'Back to forge':'Back'}</button>`;let b;
if(!USER)b=`<p>${NOLOGIN}</p><button class="go" onclick="openM()">Log in or create account</button>`;
else if(sb=='menu')b=`<p>Climb a tower with friends. Tower bosses are their own, and they hit harder and have more health the more players you bring. Every 5th floor has a special boss.</p><button class="go" onclick="sub('create')">Create room</button><button style="margin-top:8px;width:100%;text-align:center" onclick="sub('join')">Join room</button>`;
else if(sb=='create'){const pk=S.pick||2;b=`<p>Choose the maximum number of players. You will wait in a room until you start the tower.</p><div class="tabs">${[2,3,4].map(n=>`<button class="${pk==n?'on':''}" onclick="pick(${n})">${n} players</button>`).join('')}</div><div id="lerr" class="err" role="alert"></div><button class="go" onclick="createRoom()">Create room</button>`}
else b=`<p>Enter the room code your friend shared.</p><div class="dlg" style="box-shadow:none;border:0!important;padding:0;max-width:none"><label>Room code<input id="rc" maxlength="12"></label></div><div id="lerr" class="err" role="alert"></div><button class="go" onclick="joinRoom()">Join room</button>`;
return `<div class="box" style="max-width:480px;margin:0 auto"><h2>Co-op Tower</h2>${b}${bk}</div>`}
const LE=m=>{const e=document.getElementById('lerr');if(e)e.textContent=m};
async function createRoom(){LE('Creating…');try{await save();const j=await api('/api/room/create',{cap:S.pick||2});openRoom(j.code)}catch(e){LE(e.message)}}
async function joinRoom(){const code=document.getElementById('rc').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(code.length<3)return LE('Room code: 3 to 12 letters or numbers.');
LE('Joining…');try{await save();const j=await api('/api/room/join',{code});openRoom(j.code)}catch(e){LE(e.message)}}
function closeRoom(){if(ES)ES.close();ES=null;R=null;T=null}
function openRoom(code){closeRoom();T={cd:0,fx:0,last:null,seq:-1,sig:'',hold:0};
ES=new EventSource(`/api/room/events?code=${code}&token=${TOKEN}`);ES.onmessage=e=>{R=JSON.parse(e.data);onRoom()};
ES.onerror=()=>{if(ES&&ES.readyState==2){closeRoom();S.scr='lobby';S.sub='menu';render()}}}
const PH={wait:'wait',fight:'tower',reward:'trew',over:'tover'};
function onRoom(){if(!T||T.hold)return;(R.cu||[]).forEach(Game.addCustom);const ph=PH[R.phase],sig=R.phase+R.floor+R.players.map(p=>p.u).join(),ev=R.ev,isNew=ev&&ev.seq>T.seq;S.tb=Math.max(S.tb||0,R.best);if(R.coins!=null)S.coins=R.coins;
if(S.scr=='tower'&&ph!='tower'&&isNew){T.seq=ev.seq;T.hold=1;animate(ev);setTimeout(()=>{T.hold=0;if(T)onRoom()},950);return}
if(S.scr!=ph||sig!==T.sig){const first=T.seq<0;T.sig=sig;sfx[{wait:'join',tower:'start',trew:'clear',tover:'lose'}[ph]]();S.scr=ph;T.cd=0;T.fx=0;T.last=null;if(ev)T.seq=ev.seq;render();return}
if(isNew){T.seq=ev.seq;animate(ev);if(ev.by===USER.u)return}
tupd()}
function animate(ev){(ev.t?sfx.crit:sfx.hit)();if(ev.by===USER.u){T.last=ev;T.fx=1;T.cd=1;render();T.fx=0;setTimeout(()=>{if(T){T.cd=0;if(S.scr=='tower')render()}},Math.max(650,1000/st().spd));return}
const v=view(),k=v.findIndex(p=>p.u===ev.by);if(k>0)rswing(k,v[k])}
function rswing(k,p){const el=document.getElementById('tsw'+k);if(el){el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}
const sg=document.getElementById('tst');if(sg){const d=document.createElement('div');d.className='slash';d.style.setProperty('--sc',EC[P[p.eq.c].e]);sg.appendChild(d);setTimeout(()=>d.remove(),700)}
const bo=document.getElementById('tboss');if(bo){bo.classList.remove('hit');void bo.offsetWidth;bo.classList.add('hit')}}
function teamH(){return view().map(p=>`<div class="tm ${p.dead||p.off?'dn':''}"><span>${esc(p.nm)}${p.u===USER.u?' (you)':''}</span><span>${p.off?'offline':p.dead?'down':p.hp+' HP'}</span><span>dealt ${p.dealt}</span></div>`).join('')}
function tupd(){if(S.scr!='tower')return;const f=document.getElementById('bfill');if(!f)return;f.style.width=R.bossHp/R.bossMax*100+'%';
document.getElementById('btxt').textContent=`${R.bossHp}/${R.bossMax} HP. Weak to ${R.boss.w}. Recoil ${Game.recoil(R.boss.r,st().def)} per swing.`;
document.getElementById('team').innerHTML=teamH();const m=me();document.getElementById('myhp').style.width=m.hp/(m.mx||100)*100+'%';document.getElementById('myhpt').textContent=`You: ${m.hp}/${m.mx||100}`;
view().forEach((p,k)=>{const e=document.getElementById('sl'+k);if(e)e.classList.toggle('dd',!!(p.dead||p.off))})}
function waitH(){const isH=R.host===USER.u,ps=[...R.players].sort((a,b)=>(b.u===R.host)-(a.u===R.host));
const sl=Array.from({length:R.cap},(_,i)=>{const p=ps[i];return p?`<div class="ws">${svg(p.eq,'0 0 32 66',60,124)}<b>${esc(p.nm)}${p.u===USER.u?' (you)':''}</b><small>${p.u===R.host?'Host':p.off?'Offline':'Ready'}</small></div>`:`<div class="ws em"><span>Waiting…</span></div>`}).join('');
const act=isH?`<button class="go" onclick="startTower()" ${ps.length<2?'disabled':''}>${ps.length<2?'Need 2 players to start':'Start tower'}</button>`:`<p>Waiting for the host to start the tower.</p>`;
return `<div class="box" style="max-width:560px;margin:0 auto"><h2>Waiting room</h2><p>Room code: <b>${esc(R.code)}</b>. Friends choose Join room and enter it. Players: ${ps.length}/${R.cap}</p><div class="wsg">${sl}</div><div id="lerr" class="err"></div>${act}<button style="margin-top:8px;width:100%;text-align:center" onclick="tleave()">Leave room</button></div>`}
function startTower(){api('/api/room/start',{}).catch(e=>LE(e.message))}
function tatk(){if(!T||T.cd||R.phase!='fight'||me().dead)return;T.cd=1;const b=document.querySelector('.arena .go');if(b){b.disabled=true;b.textContent='Recovering…'}
api('/api/room/swing',{}).catch(()=>{T.cd=0;render()})}
const SLOT=['left:calc(50% - 150px);top:0;--d:1','left:calc(50% + 86px);top:0;--d:-1','left:calc(50% - 150px);top:145px;--d:1','left:calc(50% + 86px);top:145px;--d:-1'];
function slotH(k,p,fx){return `<div class="slot ${p.dead||p.off?'dd':''}" id="sl${k}" style="${SLOT[k]}"><div class="tsw ${fx&&k==0?'go':''}" id="tsw${k}">${svg(p.eq,'0 0 32 66',50,104)}</div><div class="tag">${esc(p.nm)}</div></div>`}
function towerH(){const s=st(),b=R.boss,L=T.last,fx=T.fx&&L,sc=L&&L.t?'#ffd84d':(s.e=='none'?'#fff':EC[s.e]),m=me(),rec=Game.recoil(b.r,s.def);
return `<div class="box arena" style="max-width:560px;margin:0 auto"><div class="tstage" id="tst">${view().slice(0,4).map((p,k)=>slotH(k,p,fx)).join('')}${fx?`<div class="slash" style="--sc:${sc}"></div><div class="spark" style="--sc:${sc}"></div>`:''}<div class="boss ${fx?'hit':''}" id="tboss" style="--bk:${b.k}">${spr(b.i,150,b.set)}${fx?`<span class="fl" style="color:${L.t?'var(--acc)':'var(--tx)'}">-${L.d}</span>`:''}</div></div><h2>Floor ${R.floor}: ${b.n}${b.sp?' (special boss)':''}</h2><div class="bar"><i id="bfill" style="width:${R.bossHp/R.bossMax*100}%;background:linear-gradient(90deg,var(--bad),var(--acc2))"></i></div><p id="btxt">${R.bossHp}/${R.bossMax} HP. Weak to ${b.w}. Recoil ${rec} per swing.</p><div class="bar${fx?' rc':''}"><i id="myhp" style="width:${m.hp/(m.mx||100)*100}%;background:var(--good)"></i></div><p id="myhpt">You: ${m.hp}/${m.mx||100}</p>${m.dead?'<p>You are down. A teammate must clear the floor to revive you.</p>':''}<button class="go swing" onclick="tatk()" ${T.cd||m.dead?'disabled':''}>${m.dead?'Down':T.cd?'Recovering…':'Swing'}</button><p style="margin-top:10px">Room code: <b>${esc(R.code)}</b></p><div id="team" class="team">${teamH()}</div><button onclick="tleave()" style="margin-top:10px">Leave tower</button></div>`}
function trewH(){const m=me();return `<div class="box"><h2>Floor ${R.floor} cleared${R.boss.sp?': special boss down!':'.'}</h2>`+(m.picked?`<p>Waiting for teammates to pick…</p>`:`<p>Choose a part. You earned ${R.gain} coins. Your team climbs to floor ${R.floor+1} when everyone has picked.</p><div class="parts">`+R.rew.map(id=>P[id]).map(p=>`<button class="part" style="--tc:${TC[p.t]}" onclick="ttake(${p.id})">${ico(p)}<span>${SL[p.s]}: ${p.n}<small>${desc(p)}</small></span></button>`).join('')+`</div><button class="go" onclick="ttake(-1)">${R.rew.length?'Skip reward and climb':'Climb'}</button>`)+`</div>`}
function ttake(id){api('/api/room/reward',{id}).then(j=>{S.owned=j.owned}).catch(()=>{})}
function toverH(){return `<div class="box" style="max-width:520px;margin:0 auto"><h2>Your team fell on floor ${R.floor}.</h2><p>Best floor: ${S.tb||0}. Rebuild your weapon and climb again.</p><button class="go" onclick="tleave()">Back to forge</button></div>`}
function tleave(){api('/api/room/leave',{}).catch(()=>{});closeRoom();S.scr='forge';render()}

S=fresh();S.scr='home';applySet();document.getElementById('ver').textContent='v'+VERSION;render();connect();
</script></body></html>
