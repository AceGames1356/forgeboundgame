<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgebound</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f121a;--bg2:#1a1f2e;--panel:#171c29;--line:#2c3448;--tx:#eceff6;--mut:#8f9ab2;--acc:#ffb347;--acc2:#ff6b3d;--bad:#ff5a6a;--good:#63d99a;--ink:#1a1206;--px:#05060a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1eee8;--bg2:#e6e1d8;--panel:#fffdf9;--line:#d3cbbd;--tx:#211d17;--mut:#6d655a;--acc:#c7710a;--acc2:#b3400f;--bad:#c22f40;--good:#1f8a55;--ink:#fff;--px:#241a0e}}
:root[data-theme="dark"]{--bg:#0f121a;--bg2:#1a1f2e;--panel:#171c29;--line:#2c3448;--tx:#eceff6;--mut:#8f9ab2;--acc:#ffb347;--acc2:#ff6b3d;--bad:#ff5a6a;--good:#63d99a;--ink:#1a1206;--px:#05060a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(1000px 500px at 50% -10%,var(--bg2),var(--bg));background-color:var(--bg);color:var(--tx);font:17px/1.4 'Barlow Semi Condensed',system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:2rem;margin:0;letter-spacing:.02em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.2rem;margin:0 0 6px}
p{margin:0 0 8px;color:var(--mut)}
.who{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px}
.who b{color:var(--tx)}
.who button{padding:3px 10px;border-radius:999px;font-size:.82rem}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 10px 30px -18px #000}
.stage{position:relative;display:grid;place-items:center;height:330px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 55%,var(--glow,#555) -40%,transparent 62%),var(--bg2)}
.stage svg{filter:drop-shadow(0 0 14px var(--glow));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(2deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.stat{background:var(--bg2);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;font-weight:600}
.stat span:first-child{color:var(--mut);font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;text-align:center;min-width:70px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:14px}
button{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s}
button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--mut)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.part{border-left:5px solid var(--tc)}
button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg2))}
button small{display:block;color:var(--mut);font-size:.82rem}
button.go{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:700;text-align:center;border:0;width:100%;padding:13px;font-size:1.1rem}
button:disabled{opacity:.5;cursor:default}
.bar{height:16px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:2px 0 4px}
.bar i{display:block;height:100%;transition:width .25s}
.arena{text-align:center;position:relative}
.boss{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:5rem;background:radial-gradient(circle,var(--bk) -20%,transparent 68%);position:relative}
.boss.hit{animation:sh .2s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fl{position:absolute;left:50%;top:10px;font-weight:700;font-size:1.6rem;animation:up .9s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.log{height:96px;overflow:auto;font-size:.92rem;color:var(--mut);text-align:left;margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.log div:first-child{color:var(--tx)}
.hint{font-size:.9rem}
@media(prefers-reduced-motion:reduce){.stage svg,.boss.hit,.fl{animation:none}}
.who{padding:5px 6px 5px 14px}.who button{padding:4px 12px;border-radius:999px;font-size:.85rem}
.ib{display:grid;place-items:center;width:36px;height:36px;padding:0!important;background:linear-gradient(180deg,var(--acc),var(--acc2))!important;color:var(--ink)!important;border:0!important}
.av{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--ink);font-weight:700}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:360px}
.dlg label{display:block;color:var(--mut);font-size:.9rem;margin-bottom:10px}
.dlg input{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.dlg input:focus-visible{outline:2px solid var(--acc)}
.err{min-height:1.3em;color:var(--bad);font-size:.9rem;margin-bottom:6px}
.boss svg{animation:bob 2.4s steps(2) infinite}@keyframes bob{50%{transform:translateY(-4px)}}.stage svg,.boss svg{image-rendering:pixelated}@media(prefers-reduced-motion:reduce){.boss svg{animation:none}}

/* pixel theme */
*{border-radius:0!important}
body{font-family:'Pixelify Sans',ui-monospace,monospace;font-size:18px;background-color:var(--bg);background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25% 75%,var(--bg2) 75%),linear-gradient(45deg,var(--bg2) 25%,transparent 25% 75%,var(--bg2) 75%);background-size:8px 8px;background-position:0 0,4px 4px}
h1{background:none;color:var(--acc);-webkit-text-fill-color:currentColor;font-size:2.4rem;text-shadow:4px 4px 0 var(--px);letter-spacing:.04em}
.box,.who,.dlg,.stat,.bar,button,.dlg input,.stage,.av{border:3px solid var(--px)!important}
.box,.dlg,.who{box-shadow:5px 5px 0 var(--px)}
.who{background:var(--panel)}.stat{background:var(--bg2);border-width:2px!important}
button{box-shadow:3px 3px 0 var(--px);transition:none;background:var(--bg2)}
button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--px);border-color:var(--px)!important;background:color-mix(in srgb,var(--acc) 22%,var(--bg2))}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--px)}
button.on{background:var(--acc)!important;color:var(--ink)!important}button.on small{color:var(--ink)}
button.go{background:var(--acc);color:var(--ink);font-weight:700;letter-spacing:.05em}
button.go:hover:not(:disabled){background:var(--acc2)}
.ib,.av{background:var(--acc)!important;color:var(--ink)!important;box-shadow:3px 3px 0 var(--px)}
.part{display:flex;gap:10px;align-items:center;border-left-width:8px!important;border-left-color:var(--tc)!important}
.part svg{flex:none}
.bar{height:22px;background:var(--px);padding:0}
.bar i{transition:width .3s steps(6);background-image:repeating-linear-gradient(90deg,transparent 0 6px,#0006 6px 8px)}
.stage{height:300px;border-width:4px!important;background-color:var(--bg2);background-image:linear-gradient(var(--px) 50%,transparent 50%);background-size:100% 8px;background-blend-mode:soft-light}
.stage::before{content:'';position:absolute;width:90px;height:90px;background:color-mix(in srgb,var(--glow) 35%,transparent);box-shadow:0 0 0 18px color-mix(in srgb,var(--glow) 22%,transparent),0 0 0 36px color-mix(in srgb,var(--glow) 12%,transparent);transform:rotate(45deg)}
.stage svg{filter:none;position:relative;animation:fl 1.6s steps(2) infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
.boss{background:none;position:relative}
.boss::after{content:'';position:absolute;bottom:4px;left:18%;width:64%;height:10px;background:#0007;z-index:-1}
.fl{font-size:2rem;text-shadow:3px 3px 0 var(--px);animation:up .9s steps(6) forwards}
.boss.hit{animation:sh .24s steps(3)}
.log{border-top:3px solid var(--px)}
.dlg input{font-family:inherit;background:var(--px);color:var(--tx)}
.ov{background:#000b}
.tabs button{flex:1}
@media(prefers-reduced-motion:reduce){.stage svg,.boss svg,.boss.hit,.fl{animation:none!important}}

/* sword strike */
.arena{overflow:visible}
.sw{position:absolute;left:calc(50% - 150px);top:-8px;width:63px;height:130px;transform-origin:50% 88%;transform:rotate(-75deg);z-index:3;pointer-events:none}
.sw.go{animation:swing .5s steps(2) both}
@keyframes swing{0%{transform:rotate(-75deg)}30%{transform:rotate(-100deg)}55%{transform:rotate(62deg)}75%{transform:rotate(62deg)}100%{transform:rotate(-75deg)}}
.slash{position:absolute;left:50%;top:70px;width:170px;height:10px;margin-left:-85px;background:var(--sc);box-shadow:0 0 0 3px var(--px);transform:rotate(-35deg) scaleX(0);z-index:4;pointer-events:none;animation:slash .3s steps(3) .25s both}
@keyframes slash{0%{transform:rotate(-35deg) scaleX(0);opacity:1}50%{transform:rotate(-35deg) scaleX(1);opacity:1}100%{transform:rotate(-35deg) scaleX(1);opacity:0}}
.spark{position:absolute;left:50%;top:85px;width:10px;height:10px;background:#fff;box-shadow:-40px -25px 0 #fff,40px -30px 0 var(--sc),-35px 35px 0 var(--sc),45px 30px 0 #fff;z-index:4;pointer-events:none;animation:sp .3s steps(3) .27s both}
@keyframes sp{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.7)}}
.boss.hit{animation:sh .24s steps(3) .27s both}
.fl{animation:up2 .9s steps(6) .27s both}
@keyframes up2{0%{opacity:0}1%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
.rc{animation:fb .3s steps(2) .3s}
@keyframes fb{50%{background:var(--bad)}}
@media(prefers-reduced-motion:reduce){.sw.go,.slash,.spark,.rc{animation:none!important}.slash,.spark{display:none}}
.team{margin-top:12px}.tm{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;text-align:left;font-size:.92rem;padding:5px 0;border-top:2px solid var(--px)}.tm.dn{opacity:.5}
.tstage{position:relative;height:270px;margin-bottom:8px}
.tstage .boss{position:absolute;left:50%;top:40px;margin:0 0 0 -75px;width:150px;height:150px}
.tstage .slash{top:95px}.tstage .spark{top:110px}
.slot{position:absolute;width:50px;height:128px;z-index:3}
.tsw{width:50px;height:104px;transform-origin:50% 88%;transform:rotate(calc(var(--d)*-75deg))}
.tsw.go{animation:tswing .5s steps(2) both}
@keyframes tswing{0%{transform:rotate(calc(var(--d)*-75deg))}30%{transform:rotate(calc(var(--d)*-100deg))}55%{transform:rotate(calc(var(--d)*62deg))}75%{transform:rotate(calc(var(--d)*62deg))}100%{transform:rotate(calc(var(--d)*-75deg))}}
.tag{font-size:.8rem;text-align:center;width:90px;margin-left:-20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.dd{opacity:.35}
.wsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
.ws{border:3px solid var(--px);background:var(--bg2);padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:200px;justify-content:center}
.ws.em{border-style:dashed;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.tsw.go{animation:none!important}}
:root[data-theme="light"]{--bg:#f1eee8;--bg2:#e6e1d8;--panel:#fffdf9;--line:#d3cbbd;--tx:#211d17;--mut:#6d655a;--acc:#c7710a;--acc2:#b3400f;--bad:#c22f40;--good:#1f8a55;--ink:#fff;--px:#241a0e}
.noanim *{animation:none!important;transition:none!important}
.home{max-width:420px;margin:10px auto;text-align:center}
.home button{display:block;width:100%;margin-top:10px;text-align:center;padding:13px;font-size:1.15rem}
.ttl{font-size:clamp(2.8rem,14vw,4.6rem);line-height:.95;font-weight:700;color:var(--acc);text-shadow:4px 4px 0 var(--px),8px 8px 0 var(--acc2);letter-spacing:.04em;margin:8px 0 14px}
.hero{display:grid;place-items:center;margin:8px 0 6px}.hero svg{animation:fl 1.6s steps(2) infinite;transform:rotate(12deg)}
.coin{display:inline-block;width:14px;height:14px;background:#ffd84d;border:3px solid var(--px);margin-right:6px;vertical-align:-2px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.orow .tabs{margin:0}

/* rarity glow */
.part[style*="--tc:#ff3b3b"]{background:linear-gradient(90deg,#ff3b3b33,var(--bg2) 70%);box-shadow:3px 3px 0 var(--px),0 0 10px #ff3b3b88}
.part[style*="--tc:#ffffff"]{background:linear-gradient(90deg,#ffffff44,var(--bg2) 70%);box-shadow:3px 3px 0 var(--px),0 0 12px #ffffffcc}
.part[style*="--tc:#ffffff"] small,.part[style*="--tc:#ff3b3b"] small{color:var(--tx)}
/* no text over sprites */
.boss{margin-top:46px}
.boss .fl{top:-44px;left:0;right:0;text-align:center;margin:0}
.tstage{height:290px}
.tstage .boss{top:66px;margin-top:0}
.slot{width:64px;height:140px}
.tsw{margin-left:7px}
.tag{width:64px;margin:2px 0 0;text-align:center}
.tstage .slash{top:110px}.tstage .spark{top:125px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.cgrid{grid-template-columns:1fr}}
.dlg select,.box select,.box input:not([type=color]){display:block;width:100%;margin:3px 0 10px;padding:8px;font:inherit;color:var(--tx);background:var(--px);border:3px solid var(--px);border-radius:0}
.box label{display:block;color:var(--mut);font-size:.9rem}
.box input[type=color]{display:block;width:80px;height:36px;margin:3px 0 10px;border:3px solid var(--px);background:var(--px)}
.cprev{display:grid;place-items:center;min-height:70px;border:3px dashed var(--line);margin:6px 0}
.admmsg{min-height:1.4em;color:var(--good)}
.box select,.box input:not([type=color]),.dlg input{background:var(--bg2)!important;color:var(--tx)!important}

/* v2 additions */
#ver{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));font-size:.78rem;color:var(--mut);opacity:.8;z-index:5;pointer-events:none;text-shadow:1px 1px 0 var(--bg)}
.dia{display:inline-block;width:11px;height:11px;background:#7fe8ff;border:3px solid var(--px);transform:rotate(45deg);margin:0 8px 0 4px;vertical-align:-1px}
.ann{border:3px dashed var(--acc);padding:8px;margin:10px 0;color:var(--acc)}
.dlg{max-height:90vh;overflow:auto}
.parts{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.part{min-width:0;overflow:hidden}.part span{min-width:0;overflow-wrap:anywhere;flex:1}.part svg{flex:none}
.btnrow{display:flex;gap:10px}.btnrow .go{flex:1;width:auto}
.guard{flex:0 0 36%;background:#3a6fd0;color:#fff;font-weight:700;text-align:center}
.telep{min-height:1.5em;color:var(--bad);font-weight:700}
.boss.tele svg{filter:drop-shadow(0 0 6px #f33) drop-shadow(0 0 12px #f33);animation:telep .3s steps(2) infinite}
@keyframes telep{50%{transform:translateX(4px)}}
.mapbox{position:relative;width:100%;height:clamp(260px,56vw,440px);overflow:auto;border:4px solid var(--px);background:#2a5a8a;-webkit-overflow-scrolling:touch}
.mapin{position:relative;aspect-ratio:96/60}.mapimg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.mpath{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nd{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;padding:0;display:grid;place-items:center;background:var(--bg2)!important;border-width:3px!important;border-color:var(--px)!important;box-shadow:2px 2px 0 var(--px)}
.nd.done{border-color:var(--good)!important}.nd.cur{border-color:var(--acc)!important;animation:ndp 1s steps(2) infinite}.nd.lock{opacity:.6;filter:grayscale(1)}.nd.sel{outline:3px solid #fff;outline-offset:2px}
@keyframes ndp{50%{transform:translateY(-3px)}}
.cut{max-width:900px;margin:0 auto}.cutm{position:relative;aspect-ratio:96/60;overflow:hidden;border:4px solid var(--px);background:#1b3a5c}
.zoomer{position:absolute;inset:0;transform-origin:20.8% 66.7%}
.cutc{min-height:3.2em;text-align:center;font-size:1.3rem;margin:12px 0;color:var(--acc)}.cutb{display:flex;gap:10px;justify-content:center}
.mgc{display:block;width:100%;max-width:420px;margin:0 auto 10px;image-rendering:pixelated;border:4px solid var(--px);background:#1b1f2e;touch-action:none}
.pad{display:flex;justify-content:space-between;align-items:center;gap:10px;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.pd{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:center;padding:0;font-size:1.2rem}
.pd.up{grid-area:1/2}.pd.lf{grid-area:2/1}.pd.rt{grid-area:2/3}.pd.dn{grid-area:3/2}
.pd.ab{width:96px;height:96px;background:var(--acc);color:var(--ink);font-weight:700;font-size:1.8rem}
@media(prefers-reduced-motion:reduce){.boss.tele svg,.nd.cur{animation:none!important}}

/* ===== v3 interface ===== */
:root{padding:0!important}
html,body{height:100%;overflow:hidden;margin:0}
#shell{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto}
#tbar{flex:none;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 4px}
main#app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px;max-width:none;margin:0;-webkit-overflow-scrolling:touch}
#nav{flex:none;display:flex;gap:5px;padding:6px 8px calc(15px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:3px solid var(--px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;font-size:.62rem;text-align:center;position:relative;box-shadow:2px 2px 0 var(--px);min-width:0}
.nb.on{background:var(--acc)!important;color:var(--ink)!important}
.nb svg{display:block}
.nbd,.hb .nbd{position:absolute;top:2px;right:6px;width:9px;height:9px;background:var(--bad);border:2px solid var(--px)}
.tb{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:4px;padding:4px 8px;box-shadow:2px 2px 0 var(--px);font-size:.85rem}
.chips{flex:1;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.chip{display:inline-flex;align-items:center;gap:3px;border:3px solid var(--px);background:var(--panel);padding:1px 6px;font-weight:700;font-size:.8rem}
.chip .coin,.chip .dia{margin:0 3px 0 0}.chip.bad{color:var(--bad)}
.gm{display:inline-block;width:9px;height:9px;background:#7fe8ff;border:2px solid var(--px);transform:rotate(45deg);margin:0 5px 0 3px}
.avb{width:34px;height:34px;padding:0;display:grid;place-items:center;background:var(--acc)!important;color:var(--ink)!important;font-weight:700;position:relative;box-shadow:2px 2px 0 var(--px);flex:none}
.wdot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;background:var(--bad);border:2px solid var(--px)}
#ver{bottom:max(1px,env(safe-area-inset-bottom,0px))}
.box{padding:10px}h2{font-size:1.05rem;margin:0 0 4px}h3{font-size:.9rem;margin:8px 0 4px;color:var(--acc)}
.fine{font-size:.74rem;color:var(--mut);margin:2px 0}
.tabs{margin:6px 0;gap:4px;flex-wrap:nowrap;display:flex}.tabs button{flex:1;min-width:0;padding:6px 2px;font-size:.8rem;text-align:center}
.btnrow{display:flex;gap:8px}
button.sm{padding:6px 12px;width:auto!important;font-size:.85rem;flex:none}
.fg{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center}
.fpv{display:grid;place-items:center;height:130px;border:3px solid var(--px);background:var(--bg2);position:relative;overflow:hidden}
.fpv::before{content:'';position:absolute;width:46px;height:46px;background:color-mix(in srgb,var(--glow) 35%,transparent);box-shadow:0 0 0 12px color-mix(in srgb,var(--glow) 20%,transparent);transform:rotate(45deg)}
.fpv svg{position:relative;animation:fl 1.6s steps(2) infinite}

async function submit(){const E=m=>{document.getElementById('err').textContent=m},g=id=>document.getElementById(id);
const u=g('f-u').value.trim().toLowerCase(),pw=g('f-p').value,n=MODE=='new'?g('f-n').value.trim():'',em=MODE=='new'?g('f-e').value.trim():'',dob=MODE=='new'?g('f-d').value:'';
if(MODE=='new'&&!n)return E('Enter your name.');
if(!/^[a-z0-9_]{3,16}$/.test(u))return E('Username: 3 to 16 letters, numbers or underscores.');

function openRoom(code){closeRoom();T={cd:0,cdt:0,cdu:0,fx:0,last:null,seq:-1,sig:'',hold:0};
ES=new EventSource(`/api/room/events?code=${code}&token=${TOKEN}`);ES.onmessage=e=>{R=JSON.parse(e.data);onRoom()};
ES.onerror=()=>{if(ES&&ES.readyState==2){closeRoom();S.scr='lobby';S.sub='menu';render()}}}
function closeRoom(){if(T&&T.cdt)clearTimeout(T.cdt);if(ES)ES.close();ES=null;R=null;T=null}
function cdMs(){return Math.max(650,1000/st().spd)}
function tbtn(){const b=document.querySelector('.arena .swing');if(!b||!T||!R)return;const dead=me().dead;b.disabled=!!(T.cd||dead);b.textContent=dead?'Down':T.cd?'Recovering…':'Swing'}
function onRoom(){if(!T||T.hold)return;(R.cu||[]).forEach(Game.addCustom);const ph=PH[R.phase],sig=R.phase+R.floor+R.players.map(p=>p.u).join();S.tb=Math.max(S.tb||0,R.best);if(R.coins!=null)S.coins=R.coins;
const evs=(R.evs&&R.evs.length?R.evs:R.ev?[R.ev]:[]).filter(e=>e.seq>T.seq);
if(T.cd&&Date.now()>T.cdu+500){T.cd=0;tbtn()}
if(S.scr=='tower'&&ph!='tower'&&evs.length){T.seq=evs[evs.length-1].seq;T.hold=1;evs.forEach(e=>animate(e));setTimeout(()=>{T.hold=0;if(T)onRoom()},950);return}
if(S.scr!=ph||sig!==T.sig){T.sig=sig;sfx[{wait:'join',tower:'start',trew:'clear',tover:'lose'}[ph]]();S.scr=ph;T.fx=0;T.last=null;T.cd=0;clearTimeout(T.cdt);if(R.ev)T.seq=R.ev.seq;render();return}
if(evs.length){T.seq=evs[evs.length-1].seq;evs.forEach(e=>animate(e))}
tupd();tbtn()}
function animate(ev){(ev.t?sfx.crit:sfx.hit)();if(ev.by===USER.u){T.last=ev;T.fx=1;render();T.fx=0;return}const v=view(),k=v.findIndex(p=>p.u===ev.by);if(k>0)rswing(k,v[k])}
function tatk(){if(!T||T.cd||R.phase!='fight'||me().dead)return;T.cd=1;T.cdu=Date.now()+cdMs();tbtn();clearTimeout(T.cdt);T.cdt=setTimeout(()=>{if(T){T.cd=0;tbtn()}},cdMs());
api('/api/room/swing',{}).catch(()=>{if(T){T.cd=0;clearTimeout(T.cdt);tbtn()}})}
function ttake(id){api('/api/room/reward',{id}).then(j=>{if(S.world==1){S.owned=j.owned;S.rev=j.rev|0}}).catch(()=>{})}
function tleave(){api('/api/room/leave',{}).catch(()=>{});closeRoom();S.scr='forge';render()}

const nav=document.getElementById('nav'),show=NAVS.includes(S.scr);nav.innerHTML=show?navH():'';nav.style.display=show?'':'none';

const RL={scr:''};
AD.cust.world=1;AD.q='';

function fightBtn(w,i){const cur=S.world==w,pr=w==2?S.b2:S.boss;if(i>pr)return '';if(cur)return i<pr?`<button class="go sm" onclick="start(${i})">Fight again</button>`:`<button class="go sm" onclick="start()">Fight</button>`;return S.cl1?`<button class="go sm" onclick="travel(${w})">Travel to World ${w}</button>`:''}

/* ===== v4: new battle screens (solo fights and co-op tower) ===== */
const elc=e=>EC[e]||'#8a8f99';
const cdBar=(on,ms)=>`<i class="cdf" ${on?`style="animation-duration:${ms}ms"`:'style="display:none"'}></i>`;
function fightH(){const s=st(),b=cb(),rec=Game.recoil(b.r,s.def,b.fl),L=S.last,fx=S.fx&&L,sc=fxc(L&&L.t?'#ffd84d':(s.e=='none'?'#fff':EC[s.e])),ag=S.ag,tele=ag&&ag.tele,gOn=ag&&Date.now()<ag.gcd,pct=Math.max(0,S.bhp)/b.hp*100,ph=Math.max(0,S.hp)/MX()*100;
return `<div class="bt-scene" style="--bk:${b.k}"><div class="bt-top"><div class="bt-name"><b>${esc(b.n)}</b>${b.w2?'<small>WORLD 2</small>':''}${isRep()?'<small>REPEAT</small>':''}<span class="wk" style="--ec:${elc(b.w)}">weak: ${b.w}</span></div><div class="bt-hp"><i id="fbf" style="width:${pct}%"></i><span id="fbt">${Math.max(0,S.bhp)} / ${b.hp}</span></div></div>
<div class="bt-stage"><div class="sw ${fx?'go':''}" style="${aura()}">${svg(null,'0 0 32 66',63,130)}</div>${fx?`<div class="slash${S.fx=='rainbow'?' rb':''}" style="--sc:${sc}"></div><div class="spark" style="--sc:${sc}"></div>`:''}<div class="boss ${fx?'hit':''} ${tele?'tele':''}" id="fboss" style="--bk:${b.k}">${bspr(b,160)}${fx?`<span class="fl" style="color:${L.t?'var(--acc)':'var(--tx)'}">-${L.d}</span>`:''}</div><div id="tele" class="bt-tele ${tele?'on':''}">${tele?esc(b.n)+' is winding up! GUARD!':''}</div><div class="bt-ev" id="evl">${S.log.slice(0,2).map(l=>'<div>'+l+'</div>').join('')}</div></div>
<div class="bt-bot"><div class="bt-me"><b>YOU</b><div class="bt-hp me"><i id="fpf" style="width:${ph}%"></i><span id="fpt">${Math.max(0,S.hp)} / ${MX()}</span></div></div><div class="bt-chips"><span>ATK ${s.atk}</span><span>DEF ${s.def}</span><span>Recoil -${rec}</span><span class="el" style="--ec:${elc(s.e)}">${s.e}</span></div><div class="bt-btns"><button class="go swing big" onclick="atk()" ${S.cd?'disabled':''}>${cdBar(S.cd,cdMs())}<span>${S.cd?'...':'SWING'}</span></button>${b.aggr?`<button id="gbtn" class="guard big" onclick="guard()" ${gOn?'disabled':''}>${gOn?'...':'GUARD'}</button>`:''}<button class="ret" onclick="retreat()">Retreat</button></div></div></div>`}
function fupd(){if(S.scr!='fight')return;const b=cb(),$=id=>document.getElementById(id);if(!$('fbf'))return;
$('fbf').style.width=Math.max(0,S.bhp)/b.hp*100+'%';$('fbt').textContent=`${Math.max(0,S.bhp)} / ${b.hp}`;$('fpf').style.width=Math.max(0,S.hp)/MX()*100+'%';$('fpt').textContent=`${Math.max(0,S.hp)} / ${MX()}`;
const ag=S.ag;$('fboss').classList.toggle('tele',!!(ag&&ag.tele));const t=$('tele');t.textContent=ag&&ag.tele?b.n+' is winding up! GUARD!':'';t.classList.toggle('on',!!(ag&&ag.tele));
const g=$('gbtn');if(g){const on=ag&&Date.now()<ag.gcd;g.disabled=!!on;g.textContent=on?'...':'GUARD'}
$('evl').innerHTML=S.log.slice(0,2).map(l=>'<div>'+l+'</div>').join('')}
function retreat(){stopAg();S.over=1;S.tgt=null;S.scr='forge';render()}
const SLOT2=['left:max(4px,calc(50% - 168px));top:4%','left:calc(50% + 100px);top:4%','left:max(4px,calc(50% - 168px));top:52%','left:calc(50% + 100px);top:52%'],SLD=[1,-1,1,-1];
function slotH(k,p,fx){return `<div class="slot ${p.dead||p.off?'dd':''}" id="sl${k}" style="${SLOT2[k]};--d:${SLD[k]}"><div class="tsw ${fx&&k==0?'go':''}" id="tsw${k}" style="${k==0?aura():''}">${svg(p.eq,'0 0 32 66',50,104)}</div><div class="tag">${esc(p.nm)}</div></div>`}
function teamH(){return view().map(p=>`<div class="tc ${p.dead||p.off?'dn':''} ${p.u===USER.u?'me':''}"><b>${esc(p.nm)}</b><div class="bt-hp sm"><i style="width:${Math.max(0,p.hp)/(p.mx||100)*100}%"></i></div><small>${p.off?'offline':p.dead?'down':p.hp+' HP'} · ${p.dealt}</small></div>`).join('')}
function towerH(){const s=st(),b=R.boss,L=T.last,fx=T.fx&&L,sc=fxc(L&&L.t?'#ffd84d':(s.e=='none'?'#fff':EC[s.e])),m=me(),rec=Game.recoil(b.r,s.def),pct=R.bossHp/R.bossMax*100,ph=Math.max(0,m.hp)/(m.mx||100)*100;
return `<div class="bt-scene" style="--bk:${b.k}"><div class="bt-top"><div class="bt-name"><b>Floor ${R.floor}: ${esc(b.n)}</b>${b.sp?'<small>SPECIAL</small>':''}<span class="wk" style="--ec:${elc(b.w)}">weak: ${b.w}</span></div><div class="bt-hp"><i id="bfill" style="width:${pct}%"></i><span id="btxt">${R.bossHp} / ${R.bossMax}</span></div></div>
<div class="bt-stage tw" id="tst">${view().slice(0,4).map((p,k)=>slotH(k,p,fx)).join('')}${fx?`<div class="slash${S.fx=='rainbow'?' rb':''}" style="--sc:${sc}"></div><div class="spark" style="--sc:${sc}"></div>`:''}<div class="boss ${fx?'hit':''}" id="tboss" style="--bk:${b.k}">${spr(b.i,150,b.set)}${fx?`<span class="fl" style="color:${L.t?'var(--acc)':'var(--tx)'}">-${L.d}</span>`:''}</div></div>
<div class="bt-bot"><div class="bt-me"><b>YOU</b><div class="bt-hp me"><i id="myhp" style="width:${ph}%"></i><span id="myhpt">${Math.max(0,m.hp)} / ${m.mx||100}</span></div></div><div class="bt-chips"><span>ATK ${s.atk}</span><span>DEF ${s.def}</span><span>Recoil -${rec}</span><span>Room ${esc(R.code)}</span></div><div id="team" class="team2">${teamH()}</div><div class="bt-btns"><button class="go swing big" onclick="tatk()" ${T.cd||m.dead?'disabled':''}>${cdBar(T.cd,Math.max(0,T.cdu-Date.now()))}<span>${m.dead?'DOWN':T.cd?'...':'SWING'}</span></button><button class="ret" onclick="tleave()">Leave</button></div>${m.dead?'<p class="fine">You are down. A teammate must clear the floor to revive you.</p>':''}</div></div>`}
function tupd(){if(S.scr!='tower')return;const f=document.getElementById('bfill');if(!f)return;f.style.width=R.bossHp/R.bossMax*100+'%';document.getElementById('btxt').textContent=`${R.bossHp} / ${R.bossMax}`;document.getElementById('team').innerHTML=teamH();const m=me();document.getElementById('myhp').style.width=Math.max(0,m.hp)/(m.mx||100)*100+'%';document.getElementById('myhpt').textContent=`${Math.max(0,m.hp)} / ${m.mx||100}`;view().forEach((p,k)=>{const e=document.getElementById('sl'+k);if(e)e.classList.toggle('dd',!!(p.dead||p.off))})}
function tbtn(){const b=document.querySelector('.bt-scene .swing');if(!b||!T||!R)return;const dead=me().dead;b.disabled=!!(T.cd||dead);const sp=b.querySelector('span');if(sp)sp.textContent=dead?'DOWN':T.cd?'...':'SWING';const c=b.querySelector('.cdf');if(c){c.style.display=T.cd?'':'none';if(T.cd){c.style.animation='none';void c.offsetWidth;c.style.animation='';c.style.animationDuration=cdMs()+'ms'}}}

S=fresh();S.scr='home';applySet();document.getElementById('ver').textContent='v'+VERSION;render();connect();
